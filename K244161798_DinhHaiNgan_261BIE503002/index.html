<html>
<head>
  <title>Heliza Store | Cửa hàng trực tuyến</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="topbar">Miễn phí vận chuyển cho đơn hàng từ 1.000.000₫</div>
  <header class="site-header">
    <a class="brand" href="index.html"></a>
    <form id="searchForm" class="header-search">
      <input id="searchInput" type="search" placeholder="Tìm kiếm sản phẩm..." aria-label="Tìm kiếm sản phẩm">
      <button type="submit">Tìm kiếm</button>
    </form>
    <nav class="header-actions" aria-label="Điều hướng chính">
      <button id="loginOpen" class="text-button">Đăng nhập</button>
      <button id="adminOpen" class="text-button">Admin</button>
      <button id="cartToggle" class="cart-button">Giỏ hàng <span id="cartCount">0</span></button>
    </nav>
  </header>

  <main class="page-layout">
    <aside class="sidebar">
      <h2>Bộ lọc sản phẩm</h2>
      <form id="filterForm">
        <label for="categoryFilter">Danh mục</label>
        <select id="categoryFilter"><option value="">Tất cả danh mục</option></select>

        <label for="minPrice">Giá từ (₫)</label>
        <input id="minPrice" type="number" min="0" placeholder="0">
        <label for="maxPrice">Đến giá (₫)</label>
        <input id="maxPrice" type="number" min="0" placeholder="Không giới hạn">

        <label for="colorFilter">Màu sắc</label>
        <select id="colorFilter">
          <option value="">Tất cả màu</option>
          <option>Đen</option><option>Trắng</option><option>Xám</option>
          <option>Xanh</option><option>Đỏ</option><option>Vàng</option>
          <option>Nâu</option><option>Hồng</option>
        </select>

        <label for="ratingFilter">Đánh giá tối thiểu</label>
        <select id="ratingFilter">
          <option value="0">Tất cả</option>
          <option value="3">Từ 3 sao</option>
          <option value="4">Từ 4 sao</option>
          <option value="4.5">Từ 4.5 sao</option>
        </select>
        <button class="primary-button full" type="submit">Áp dụng bộ lọc</button>
        <button class="secondary-button full" id="resetFilters" type="button">Xóa bộ lọc</button>
      </form>
    </aside>

    <section class="catalog">
      <div class="catalog-heading">
        <div><p class="eyebrow">COLLECTION</p><h1>Sản phẩm nổi bật</h1><p id="resultCount" class="muted">Đang tải sản phẩm...</p></div>
        <select id="sortSelect" aria-label="Sắp xếp sản phẩm">
          <option value="default">Sắp xếp mặc định</option>
          <option value="price-asc">Giá tăng dần</option>
          <option value="price-desc">Giá giảm dần</option>
          <option value="rating-desc">Đánh giá cao</option>
        </select>
      </div>
      <div id="productGrid" class="product-grid" aria-live="polite"></div>
      <p id="emptyState" class="empty-state" hidden>Không tìm thấy sản phẩm phù hợp.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div><strong>Heliza Store</strong></div>
    <div>Đinh Hải Ngân - K244161798</div>
   </footer>

  <div id="cartPanel" class="drawer" aria-hidden="true">
    <div class="drawer-head"><h2>Giỏ hàng</h2><button class="icon-button" data-close="cartPanel" aria-label="Đóng">×</button></div>
    <div id="cartItems"></div>
    <div class="cart-summary"><div><span>Tạm tính</span><strong id="cartSubtotal">0₫</strong></div><button id="checkoutOpen" class="primary-button full">Thanh toán</button></div>
  </div>
  <div id="overlay" class="overlay"></div>

  <dialog id="quickViewDialog" class="modal">
    <button class="modal-close" data-close-dialog="quickViewDialog">×</button>
    <div id="quickViewContent"></div>
  </dialog>

  <dialog id="loginDialog" class="modal small-modal">
    <button class="modal-close" data-close-dialog="loginDialog">×</button>
    <h2>Đăng nhập</h2>
    <form id="loginForm" class="stack-form">
      <label>Email<input id="loginEmail" type="email" required autocomplete="username"></label>
      <label>Mật khẩu<input id="loginPassword" type="password" required autocomplete="current-password"></label>
      <button class="primary-button full" type="submit">Đăng nhập</button>
      <p id="loginMessage" class="form-message" role="status"></p>
    </form>
  </dialog>

  <dialog id="checkoutDialog" class="modal small-modal">
    <button class="modal-close" data-close-dialog="checkoutDialog">×</button>
    <h2>Thông tin giao hàng</h2>
    <form id="checkoutForm" class="stack-form" novalidate>
      <label>Họ và tên<input id="checkoutName" required minlength="2" placeholder="Nguyễn Văn A"></label>
      <label>Email<input id="checkoutEmail" type="email" required placeholder="email@example.com"></label>
      <label>Số điện thoại<input id="checkoutPhone" inputmode="numeric" required placeholder="0901234567"></label>
      <label>Địa chỉ<input id="checkoutAddress" required minlength="8" placeholder="Số nhà, đường, phường, quận..."></label>
      <label>Ghi chú<textarea id="checkoutNote" rows="2"></textarea></label>
      <div id="checkoutMessage" class="form-message" role="alert"></div>
      <button class="primary-button full" type="submit">Xác nhận đặt hàng</button>
    </form>
  </dialog>

  <dialog id="adminDialog" class="modal admin-modal">
    <button class="modal-close" data-close-dialog="adminDialog">×</button>
    <div class="admin-heading"><div><p class="eyebrow">QUẢN TRỊ HỆ THỐNG</p><h2>Dashboard Admin</h2></div><span id="adminUser" class="muted"></span></div>
    <div id="adminContent"></div>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
